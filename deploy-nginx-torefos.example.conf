##
# Default server — torefos.no via Cloudflare tunnel
##

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;
    server_name _;

    # --- Oppetid: linjemåling under /uptime/ ----------------------------
    location = /uptime {
        return 301 /uptime/;
    }

    location /uptime/ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /uptime/index.html;
    }

    location = /uptime/health {
        proxy_pass http://127.0.0.1:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location /uptime/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location = /uptime/ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        tcp_nodelay on;
    }

    # --- Study World (embeddable same-origin on torefos.no) -------------
    # Ikke sett X-Frame-Options: DENY/SAMEORIGIN her hvis du senere
    # trenger cross-origin embed — bruk heller CSP frame-ancestors.
    location = /study-world {
        absolute_redirect off;  # bak Cloudflare er $scheme http — hold Location relativ
        return 301 /study-world/;
    }
    location /study-world/ {
        # mime.types i nginx.conf gir application/javascript for .js (ES-moduler)
        try_files $uri $uri/ /study-world/index.html;
        # Tillat innramming fra samme origin (torefos.no forsiden)
        # Små, håndredigerte filer: la Cloudflare og nettleser sjekke med origin
        # hver gang, ellers henger gamle .js igjen i kanten i timevis etter utrulling.
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "frame-ancestors 'self' https://torefos.no https://www.torefos.no" always;
        # Eksplisitt: ikke send X-Frame-Options
    }

    # --- resten av torefos (lab, ecoplan, tshoot, …) --------------------
    location / {
        try_files $uri $uri/ =404;
    }
}
