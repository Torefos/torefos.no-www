# /etc/nginx/sites-available/oppetid
# IKT Agder Oppetid
#
# Legg statiske filer i /var/www/oppetid/public og kjør backend på 127.0.0.1:8080.
# Aktiver med:
#   ln -s /etc/nginx/sites-available/oppetid /etc/nginx/sites-enabled/oppetid
#   nginx -t && systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name oppetid.internt.ikt-agder.no;

    # Ved HTTPS: kommenter ut blokken under og bruk 443-blokken nederst i stedet.

    access_log /var/log/nginx/oppetid.access.log;
    error_log  /var/log/nginx/oppetid.error.log;

    root /var/www/oppetid/public;
    index index.html;

    # --- statiske filer -------------------------------------------------
    # Målingene skal aldri treffe en cache, ellers måler vi cachen.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # --- sideinnlastingsmålingen ----------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # --- oversikt over pågående målinger --------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
    }

    # --- WebSocket -------------------------------------------------------
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Viktig: uten dette klipper nginx forbindelsen etter 60 sekunder
        # og du får falske brudd i målingen.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering off;
        tcp_nodelay on;
    }
}

